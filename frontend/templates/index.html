<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Inventory - Flask App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1 class="page-title">{{ message }}</h1>

    <button id="addStockToggleBtn" class="toggle-btn">Add Stock</button>

    <div class="container form-container hidden" id="stockPanel">
        <h2>Add Stock</h2>
        <p class="subtitle">Add a new item to inventory.</p>

        <form id="stockForm">
            <div class="field">
                <label for="stockName">Stock Name</label>
                <input type="text" id="stockName" name="stockName" placeholder="e.g. Wireless Mouse" required>
            </div>

            <div class="field">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="0" step="1" placeholder="e.g. 50" required>
            </div>

            <div class="field">
                <label for="price">Price (per unit)</label>
                <input type="number" id="price" name="price" min="0" step="0.01" placeholder="e.g. 19.99" required>
            </div>

            <div class="field">
                <label for="purchaseDate">Purchase Date</label>
                <input type="date" id="purchaseDate" name="purchaseDate" required>
            </div>

            <div class="field">
                <label for="category">Category <span class="optional">(optional)</span></label>
                <input type="text" id="category" name="category" placeholder="e.g. Electronics">
            </div>

            <button type="submit" id="addStockBtn">Add Stock</button>
        </form>

        <div id="stockFormStatus" class="status-message"></div>

        <table id="stockTable" class="stock-table hidden">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Purchase Date</th>
                    <th>Category</th>
                </tr>
            </thead>
            <tbody id="stockTableBody"></tbody>
        </table>
    </div>

    <script>
        window.APP_CONFIG = {
            BACKEND_API_URL: "{{ backend_api_url }}"
        };
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
